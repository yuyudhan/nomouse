[package]
name = "nomouse"
description = "Keyboard-driven clicking for Linux, macOS and Windows via the accessibility tree."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
nomouse-core.workspace = true
thiserror.workspace = true
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "ansi",
] }

[features]
default = ["wayland"]
# The Linux Wayland backend (wlroots compositors); off builds an X11-only binary.
wayland = ["nomouse-linux/wayland"]

[target.'cfg(unix)'.dependencies]
# getuid for the command socket's fallback directory (safe wrapper, no unsafe here).
rustix = { version = "1", default-features = false, features = ["process", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
nomouse-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
nomouse-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
nomouse-windows.workspace = true

[lints]
workspace = true

# .deb for the release (scripts/release/deb.sh); no maintainer scripts: the binary, its docs and
# the app launcher entry with its icons (packaging/linux/share, the same files as the tarball).
[package.metadata.deb]
maintainer = "yuyudhan <yuyudhan@users.noreply.github.com>"
copyright = "yuyudhan"
section = "utils"
priority = "optional"
depends = "libc6 (>= 2.35)"
extended-description = """\
nomouse labels every clickable element of the focused window from the accessibility tree; \
typing a label clicks it. Needs the AT-SPI accessibility bus and an X11 session or a wlroots \
Wayland compositor (Sway, Hyprland)."""
assets = [
    [
        "target/release/nomouse",
        "usr/bin/",
        "755",
    ],
    [
        "../../README.md",
        "usr/share/doc/nomouse/README.md",
        "644",
    ],
    [
        "../../CHANGELOG.md",
        "usr/share/doc/nomouse/CHANGELOG.md",
        "644",
    ],
    [
        "../../packaging/linux/share/applications/io.github.yuyudhan.nomouse.desktop",
        "usr/share/applications/io.github.yuyudhan.nomouse.desktop",
        "644",
    ],
    [
        "../../packaging/linux/share/icons/hicolor/scalable/apps/io.github.yuyudhan.nomouse.svg",
        "usr/share/icons/hicolor/scalable/apps/io.github.yuyudhan.nomouse.svg",
        "644",
    ],
    [
        "../../packaging/linux/share/icons/hicolor/16x16/apps/io.github.yuyudhan.nomouse.png",
        "usr/share/icons/hicolor/16x16/apps/io.github.yuyudhan.nomouse.png",
        "644",
    ],
    [
        "../../packaging/linux/share/icons/hicolor/22x22/apps/io.github.yuyudhan.nomouse.png",
        "usr/share/icons/hicolor/22x22/apps/io.github.yuyudhan.nomouse.png",

[package]
name = "nomouse-core"
description = "Platform-independent core of nomouse: elements, hint labels, actions, config and the platform traits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Glyph outlines (skrifa) filled into tiny-skia pixmaps, shared by the overlay renderers.
glyph = ["dep:skrifa", "dep:tiny-skia"]
# The backend contract suite and the in-memory FakePlatform, for other crates' tests.
testing = []

[dependencies]
serde.workspace = true
skrifa = { version = "0.49", optional = true }
thiserror.workspace = true
tiny-skia = { version = "0.12", default-features = false, features = [
    "std",
    "simd",
], optional = true }
toml.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

[package]
name = "nomouse-macos"
description = "macOS backend for nomouse: AXUIElement elements, NSPanel overlay, CGEvent input."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nomouse-core.workspace = true
nomouse-sys-macos.workspace = true
num-traits = "0.2"
serde_json = "1.0"
tracing = "0.1"

[features]
# Drivers that work the settings window as a user would, for its UI test.
testing = ["nomouse-sys-macos/testing"]

[dev-dependencies]
nomouse-core = { workspace = true, features = ["testing"] }

[[test]]
name = "macos_accessibility"
harness = false

[[test]]
name = "settings_window"
harness = false
required-features = ["testing"]

[[test]]
name = "result_windows"
harness = false
required-features = ["testing"]

[[test]]
name = "start_at_login"
harness = false
required-features = ["testing"]

[lints]
workspace = true

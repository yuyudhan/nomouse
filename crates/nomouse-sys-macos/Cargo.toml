[package]
name = "nomouse-sys-macos"
description = "The only crate allowed to call Accessibility (AXUIElement), CGEvent and AppKit FFI for nomouse; exposes safe APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-application-services = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSEnumerator",
    "NSFileManager",
    "NSGeometry",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRange",
    "NSRunLoop",
    "NSString",
    "NSURL",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "objc2-uniform-type-identifiers",
    "NSAccessibilityConstants",
    "NSAccessibilityProtocols",
    "NSActionCell",
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSColorSpace",
    "NSColorWell",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSGridView",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutAnchor",
    "NSLayoutConstraint",
    "NSUserInterfaceItemIdentification",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSParagraphStyle",
    "NSPasteboard",
    "NSPopUpButton",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScrollView",
    "NSStackView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStepper",
    "NSStringDrawing",
    "NSTabView",
    "NSTabViewController",
    "NSTabViewItem",
    "NSText",
    "NSTextField",
    "NSTextView",
    "NSToolbar",
    "NSUserInterfaceLayout",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSWorkspace",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
    "CATextLayer",
    "CATransaction",
] }
objc2-service-management = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "SMAppService",
] }
objc2-uniform-type-identifiers = { version = "0.3.2", default-features = false, features = [
    "std",
    "UTType",
] }

[lints]
workspace = true

[package]
name = "nomouse-sys-macos"
description = "The only crate allowed to call Accessibility (AXUIElement), CGEvent and AppKit FFI for nomouse; exposes safe APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-application-services = "0.3.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSAttributedString",
    "NSDictionary",
    "NSEnumerator",
    "NSObjCRuntime",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSValue",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSStringDrawing",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "CALayer",
    "CATextLayer",
    "CATransaction",
] }

[lints]
workspace = true

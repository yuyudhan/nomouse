[package]
name = "nomouse-linux"
description = "Linux backend for nomouse: AT-SPI elements, X11 overlay, XTEST input and XGrabKey hotkeys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
nomouse-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2"
atspi = { version = "0.30", default-features = false, features = ["proxies", "zbus"] }
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await-macro",
] }
nomouse-core = { workspace = true, features = ["glyph"] }
rustix = { version = "1", default-features = false, features = ["event", "std"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
tracing = "0.1"
x11rb = { version = "0.14", features = ["randr", "shape", "xtest"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

[lints]
workspace = true

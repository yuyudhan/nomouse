[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained; ab_glyph (overlay label rendering) still depends on it.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained (not a vulnerability), pulled by ab_glyph for overlay label rendering; replacing the font stack is tracked as a separate task" },
]

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
]
# The workspace crates are unpublished and the project licence is not yet chosen.
private = { ignore = true }

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "syn@2", reason = "windows-rs 0.62 proc macros (windows-implement/interface)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

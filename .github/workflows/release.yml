name: Release

# A pushed tag vX.Y.Z (from `just release X.Y.Z`) builds every platform and publishes the
# GitHub release. Running it by hand (workflow_dispatch) is a dry run: it builds and packs
# everything and uploads the assets as a workflow artifact, but creates no release and no tag.
on:
    push:
        tags: ["v[0-9]+.[0-9]+.[0-9]+"]
    workflow_dispatch:

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    version:
        name: Version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - id: version
              name: Read the workspace version
              run: |
                  version="$(scripts/release/version.sh)"
                  # A tag release must match the workspace version and have changelog notes.
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
                          echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version ${version}"
                          exit 1
                      fi
                      scripts/release/notes.sh "$version" >/dev/null
                  fi
                  echo "version=${version}" >>"$GITHUB_OUTPUT"

    linux:
        name: Linux ${{ matrix.target }}
        needs: version
        # Native runners for both architectures: the settings window links GTK 4 and
        # libadwaita, which a cross linker cannot find. 22.04 (GTK 4.6, libadwaita 1.1, glibc
        # 2.35) is the oldest system the binaries run on.
        runs-on: ${{ matrix.runner }}
        strategy:
            fail-fast: true
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      runner: ubuntu-22.04
                    - target: aarch64-unknown-linux-gnu
                      runner: ubuntu-22.04-arm
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install the pinned toolchain
              run: rustup show active-toolchain || rustup toolchain install
            - name: Install GTK 4 and libadwaita (the settings window)
              run: |
                  sudo apt-get update -q
                  sudo apt-get install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  key: release-${{ matrix.target }}
            - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
              with:
                  tool: cargo-deb
            - name: Build
              id: build
              # An assignment first, so a failed build fails this step (an `echo` around the
              # command substitution would hide its exit status).
              run: |
                  binary="$(scripts/release/build.sh ${{ matrix.target }})"
                  echo "binary=${binary}" >>"$GITHUB_OUTPUT"
            - name: Smoke test
              run: |
                  "${{ steps.build.outputs.binary }}" --version
                  "${{ steps.build.outputs.binary }}" --version | grep -q "${{ needs.version.outputs.version }}"
                  "$(dirname "${{ steps.build.outputs.binary }}")/nomouse-settings" --version | grep -q "${{ needs.version.outputs.version }}"
            - name: Package
              run: |
                  scripts/release/package.sh ${{ matrix.target }} "${{ steps.build.outputs.binary }}" dist
                  scripts/release/deb.sh ${{ matrix.target }} dist
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: assets-${{ matrix.target }}
                  path: dist/*
                  if-no-files-found: error

    macos:
        name: macOS universal
        needs: version
        runs-on: macos-latest
        outputs:
            # "developer-id" or "ad-hoc" (scripts/release/signature.sh); the cask depends on it.
            signing: ${{ steps.package.outputs.signing }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install the pinned toolchain
              run: |
                  rustup show active-toolchain || rustup toolchain install
                  rustup target add aarch64-apple-darwin x86_64-apple-darwin
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  key: release-macos
            # build.sh sets MACOSX_DEPLOYMENT_TARGET=11.0 and checks each slice's minos.
            - name: Build arm64 and x86_64, join them with lipo
              id: build
              run: |
                  arm="$(scripts/release/build.sh aarch64-apple-darwin)"
                  intel="$(scripts/release/build.sh x86_64-apple-darwin)"
                  mkdir -p target/universal-apple-darwin
                  lipo -create -output target/universal-apple-darwin/nomouse "$arm" "$intel"
                  lipo -info target/universal-apple-darwin/nomouse
                  echo "binary=target/universal-apple-darwin/nomouse" >>"$GITHUB_OUTPUT"
            # Developer ID signing and notarization when the repository has the secrets (see
            # CONTRIBUTING.md#releases); without them nomouse.app and the disk image are ad-hoc
            # signed, which the curl installers do not mind (curl sets no quarantine flag).
            - name: Signing
              env:
                  MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
                  MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
                  MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
                  NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
                  NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
                  NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
              run: scripts/release/signing.sh
            - name: Smoke test
              run: |
                  "${{ steps.build.outputs.binary }}" --version
                  "${{ steps.build.outputs.binary }}" --version | grep -q "${{ needs.version.outputs.version }}"
            - name: Package
              id: package
              # An assignment first, so a failed signature check fails this step.
              run: |
                  scripts/release/package.sh universal-apple-darwin "${{ steps.build.outputs.binary }}" dist
                  scripts/release/app.sh "${{ steps.build.outputs.binary }}" dist
                  scripts/release/dmg.sh dist/nomouse.app dist
                  signing="$(scripts/release/signature.sh dist/nomouse.app)"
                  echo "signing=${signing}" >>"$GITHUB_OUTPUT"
                  rm -rf dist/nomouse.app
            - name: Gatekeeper accepts the disk image
              if: env.NOMOUSE_NOTARY_KEY_ID != ''
              run: spctl --assess --type open --context context:primary-signature --verbose dist/nomouse-universal-apple-darwin.dmg
            # The bundle checks build ad-hoc copies, so they never spend a notarization.
            - name: Test nomouse.app, the disk image and the cask
              env:
                  NOMOUSE_SIGN_IDENTITY: "-"
                  NOMOUSE_NOTARY_KEY_ID: ""
              run: |
                  command -v 7zz || brew install sevenzip
                  scripts/test-app.sh --bin "${{ steps.build.outputs.binary }}"
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: assets-universal-apple-darwin
                  path: dist/*
                  if-no-files-found: error

    # The shipped macOS assets on the oldest hosted arm64 macOS and on GitHub's Intel runner, as
    # an x86_64 Mac runs them (macos-13 and macos-14 are retired). Older macOS (11 and later is
    # the build's minos, which build.sh checks) has no hosted runner.
    macos-smoke:
        name: macOS smoke test (${{ matrix.runner }})
        needs: [version, macos]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15-intel
                      arch: x86_64
                    - runner: macos-15
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        steps:
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: assets-universal-apple-darwin
                  path: dist
            - name: Run the universal binary and nomouse.app
              run: |
                  test "$(uname -m)" = "${{ matrix.arch }}"
                  sw_vers
                  mkdir -p unpacked
                  tar -xzf dist/nomouse-universal-apple-darwin.tar.gz -C unpacked
                  bin=unpacked/nomouse-universal-apple-darwin/nomouse
                  lipo -archs "$bin" | grep -qw "${{ matrix.arch }}"
                  "$bin" --version | grep -q "${{ needs.version.outputs.version }}"
                  # No Accessibility grant on the runner: doctor reports and exits non-zero, but
                  # it must run and print its report.
                  report="$("$bin" doctor || true)"
                  printf '%s\n' "$report"
                  grep -q '^platform: macos' <<<"$report"
                  ditto -x -k dist/nomouse-universal-apple-darwin.app.zip unpacked
                  codesign --verify --deep --strict unpacked/nomouse.app
                  unpacked/nomouse.app/Contents/MacOS/nomouse --version | grep -q "${{ needs.version.outputs.version }}"

    windows:
        name: Windows x86_64
        needs: version
        runs-on: windows-latest
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install the pinned toolchain
              run: |
                  rustup show active-toolchain || rustup toolchain install
                  rustup target add x86_64-pc-windows-msvc
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
              with:
                  key: release-windows
            - name: Build
              id: build
              # An assignment first, so a failed build fails this step (an `echo` around the
              # command substitution would hide its exit status).
              run: |
                  binary="$(scripts/release/build.sh x86_64-pc-windows-msvc)"
                  echo "binary=${binary}" >>"$GITHUB_OUTPUT"
            - name: Smoke test
              run: |
                  "${{ steps.build.outputs.binary }}" --version
                  "${{ steps.build.outputs.binary }}" --version | grep -q "${{ needs.version.outputs.version }}"
            - name: Package
              run: scripts/release/package.sh x86_64-pc-windows-msvc "${{ steps.build.outputs.binary }}" dist
            - name: Test install.ps1 against the built archive
              run: pwsh -NoProfile -File scripts/test-install.ps1 -Dist dist
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: assets-x86_64-pc-windows-msvc
                  path: dist/*
                  if-no-files-found: error

    assemble:
        name: Assemble${{ github.ref_type == 'tag' && ' and publish' || ' (dry run)' }}
        needs: [version, linux, macos, macos-smoke, windows]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  pattern: assets-*
                  path: dist
                  merge-multiple: true
            - name: Installers, Homebrew formula and SHA256SUMS
              env:
                  NOMOUSE_MACOS_SIGNING: ${{ needs.macos.outputs.signing }}
              run: scripts/release/finish.sh "${{ needs.version.outputs.version }}" dist
            # The installed nomouse-settings must start (`--version`), which needs the GTK 4 and
            # libadwaita runtime libraries a desktop has and the runner image lacks.
            - name: Install GTK 4 and libadwaita (runtime only)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-4-1 libadwaita-1-0
            - name: Test install.sh against the built Linux archive
              run: scripts/test-install.sh dist
            - name: List assets
              run: ls -l dist && cat dist/SHA256SUMS
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: release-${{ needs.version.outputs.version }}
                  path: dist/*
                  if-no-files-found: error
            - name: Publish the GitHub release
              if: github.ref_type == 'tag'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  scripts/release/notes.sh "${{ needs.version.outputs.version }}" >notes.md
                  gh release create "$GITHUB_REF_NAME" dist/* \
                      --title "nomouse ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag

    # Formula/nomouse.rb and Casks/nomouse.rb in yuyudhan/homebrew-tap, after the GitHub release
    # exists: publish-homebrew.sh audits and installs the cask and the formula from the new tap
    # commit before it pushes. HOMEBREW_TAP_TOKEN: a fine-grained token with Contents read and
    # write on yuyudhan/homebrew-tap (CONTRIBUTING.md#releases); without it the job skips with
    # a notice saying so, and the release stays green. A dry run publishes to a local copy of
    # the tap with `brew style` only (its version has no release to install from).
    homebrew:
        name: ${{ github.ref_type == 'tag' && 'Homebrew tap' || 'Homebrew tap (dry run)' }}
        needs: [version, assemble]
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
              with:
                  name: release-${{ needs.version.outputs.version }}
                  path: dist
            - name: Install from the new tap commit and push it
              if: github.ref_type == 'tag'
              env:
                  GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
                  VERSION: ${{ needs.version.outputs.version }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                      echo "::notice title=Homebrew tap skipped::The HOMEBREW_TAP_TOKEN secret is not set, so the tap was not updated. Add a fine-grained token with Contents read and write on yuyudhan/homebrew-tap as that repository secret, or publish from a machine with gh logged in: scripts/release/publish-homebrew.sh ${VERSION} <release assets>"
                      exit 0
                  fi
                  scripts/release/publish-homebrew.sh "$VERSION" dist
            - name: Publish to a local copy of the tap
              if: github.ref_type != 'tag'
              run: |
                  git clone --quiet --bare https://github.com/yuyudhan/homebrew-tap.git "${RUNNER_TEMP}/tap.git"
                  NOMOUSE_TAP_REMOTE="file://${RUNNER_TEMP}/tap.git" \
                      scripts/release/publish-homebrew.sh "${{ needs.version.outputs.version }}" dist --no-install
                  git -C "${RUNNER_TEMP}/tap.git" log -1 --stat

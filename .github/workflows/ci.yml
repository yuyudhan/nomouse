name: CI

on:
    push:
        branches: [nightly]
    pull_request:
        branches: [nightly]

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: -D warnings

jobs:
    check:
        name: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install the pinned toolchain
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
            - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
              with:
                  tool: taplo-cli,typos-cli
            - name: Install GTK 4 and libadwaita (the Linux settings window)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
            - name: Format
              run: |
                  cargo fmt --all -- --check
                  taplo fmt --check
            - name: Guards
              run: |
                  scripts/check-line-count.sh
                  scripts/check-unsafe.sh
            - name: Typos
              run: typos
            - name: Shellcheck
              if: runner.os == 'Linux'
              run: git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 shellcheck --severity=style
            - name: PSScriptAnalyzer
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
                      Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
                  }
                  Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error -EnableExit
                  Invoke-ScriptAnalyzer -Path scripts/test-install.ps1 -Severity Warning,Error -EnableExit
            - name: Clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings
            - name: Test (core, binary, Linux backend)
              run: cargo test --workspace --all-features --exclude nomouse-windows --exclude nomouse-macos
            # The Windows and macOS backends' unit tests and fake-system contract tests run on
            # every OS; their real-desktop integration tests run on their own OS: the WinForms
            # UI Automation test and the real-backend contract on the Windows runner's desktop,
            # the Finder test on macOS (it skips itself without an Accessibility grant).
            - name: Test (Windows + macOS backends, integration on their OS)
              run: cargo test -p nomouse-windows -p nomouse-macos --all-features -- --nocapture
            - name: desktop-file-validate for the installer test
              if: runner.os == 'Linux'
              run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends desktop-file-utils
            - name: install.sh against a fake release
              if: runner.os != 'Windows'
              run: scripts/test-installer.sh
            - name: install.ps1 end to end
              if: runner.os == 'Windows'
              run: |
                  cargo build --locked -p nomouse
                  scripts/release/package.sh x86_64-pc-windows-msvc target/debug/nomouse.exe target/installer-dist
                  pwsh -NoProfile -File scripts/test-install.ps1 -Dist target/installer-dist

    e2e-linux:
        name: e2e (Linux X11, Xvfb + i3 + AT-SPI)
        # 22.04: its Qt 5.15.3 (python3-pyqt5) registers with AT-SPI; 24.04's Qt 5.15.13 never
        # appeared on the accessibility bus on the runner (T88).
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install the pinned toolchain
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
            - name: Install the X11 session, AT-SPI, GTK and Qt
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends xvfb i3-wm xdotool x11-utils \
                      dbus-daemon at-spi2-core python3-gi gir1.2-gtk-3.0 gir1.2-atspi-2.0 python3-pyqt5 fonts-dejavu-core
            - name: e2e (GTK, Chromium, Qt)
              run: scripts/e2e-linux.sh --display :99 --require-chromium --require-qt

    e2e-wayland:
        name: e2e (Linux Wayland, headless Sway + XWayland + AT-SPI)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install the pinned toolchain
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
            - name: Install Sway, XWayland, wtype, grim, AT-SPI and GTK
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends sway xwayland wtype grim \
                      dbus-daemon at-spi2-core python3-gi gir1.2-gtk-3.0 fonts-dejavu-core
            - name: e2e (native Wayland and XWayland GTK)
              run: |
                  set +e
                  scripts/e2e-wayland.sh 2>&1 | tee /tmp/e2ew.log
                  rc=${PIPESTATUS[0]}
                  if [ "$rc" != 0 ]; then
                      msg="$(grep -E -B2 -A6 'FAIL|no XWayland|never' /tmp/e2ew.log | head -c 30000; echo ---TAIL---; tail -n 40 /tmp/e2ew.log)"
                      msg="${msg//'%'/'%25'}"; msg="${msg//$'\r'/'%0D'}"; msg="${msg//$'\n'/'%0A'}"
                      echo "::error title=e2e-wayland diag::$msg"
                  fi
                  exit "$rc"

    e2e-desktop:
        name: e2e (Linux desktop app, tray + settings window, X11 and headless Sway)
        # 22.04: the oldest GTK 4 (4.6) and libadwaita (1.1) the settings window supports.
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install the pinned toolchain
              run: rustup show active-toolchain || rustup toolchain install
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
            - name: Install the sessions, AT-SPI, GTK 4, libadwaita and waybar
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends xvfb i3-wm xdotool x11-utils \
                      imagemagick dbus-daemon dbus-x11 at-spi2-core libglib2.0-bin python3-gi \
                      gir1.2-atspi-2.0 gir1.2-gdkpixbuf-2.0 libgtk-4-dev libadwaita-1-dev sway waybar grim \
                      fonts-dejavu-core adwaita-icon-theme
            - name: e2e (launcher entry, tray menu, settings window)
              run: scripts/e2e-desktop.sh --display :98
            - name: Settings window UI test (in-process, every page, recorder, reset)
              run: NOMOUSE_UI_TESTS=1 GDK_BACKEND=x11 xvfb-run -a dbus-run-session -- cargo test -p nomouse-settings --test ui

    coverage:
        name: coverage (floor)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - name: Install the pinned toolchain
              run: |
                  rustup show active-toolchain || rustup toolchain install
                  rustup component add llvm-tools-preview
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
            - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
              with:
                  tool: cargo-llvm-cov
            - name: Install GTK 4 and libadwaita (the Linux settings window)
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
            - name: Coverage
              run: scripts/coverage.sh

    deny:
        name: cargo-deny
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

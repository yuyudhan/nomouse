[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.13"
edition = "2024"
# The oldest Rust that builds nomouse: kbvm (the Linux keymap reader) needs 1.95. The CI `msrv`
# job checks the workspace with exactly this version on Linux, macOS and Windows.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yuyudhan/nomouse"
publish = false

[workspace.dependencies]
nomouse-core = { path = "crates/nomouse-core" }
# The binary picks the backend's features (`wayland`, on by default there).
nomouse-linux = { path = "crates/nomouse-linux", default-features = false }
nomouse-macos = { path = "crates/nomouse-macos" }
nomouse-sys-macos = { path = "crates/nomouse-sys-macos" }
nomouse-windows = { path = "crates/nomouse-windows" }
nomouse-sys-windows = { path = "crates/nomouse-sys-windows" }
clap = { version = "4.6", features = ["derive"] }
proptest = "1.12"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "1.2"

[profile.release]
strip = "symbols"
lto = "thin"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
struct_excessive_bools = "allow"
undocumented_unsafe_blocks = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"
